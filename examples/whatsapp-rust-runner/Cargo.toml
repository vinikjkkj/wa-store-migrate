[package]
name = "wastoremigrate-whatsapp-rust-runner"
version = "0.1.0"
edition = "2024"
publish = false

# Companion runner for `examples/wa-web-to-rust.ts`. Opens a pre-migrated
# `whatsapp.db`, spawns the whatsapp-rust Bot, and connects.

[dependencies]
whatsapp-rust = { path = "../../whatsapp-rust" }
whatsapp-rust-tokio-transport = { path = "../../whatsapp-rust/transports/tokio-transport" }
whatsapp-rust-ureq-http-client = { path = "../../whatsapp-rust/http_clients/ureq-client" }
wacore = { path = "../../whatsapp-rust/wacore" }

env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
